name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('bridge/**/*.gradle', 'bridge/**/gradle.properties', 'bridge/**/gradle-wrapper.properties') }}
      - name: Build NeoForge bridge
        run: node scripts/build-bridge.mjs neoforge
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - name: Build Fabric bridge
        run: node scripts/build-bridge.mjs fabric
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: bridge
          path: resources/bridge/*.jar
          if-no-files-found: error

  build:
    needs: bridge
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundles: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: bridge
          path: resources/bridge
      - run: npm install --no-audit --no-fund
      - run: node scripts/build.mjs
      - run: node scripts/build-service.mjs
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: modsmith-${{ runner.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: modsmith-*
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          name: Modsmith ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
