name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('bridge/**/*.gradle', 'bridge/**/gradle.properties', 'bridge/**/gradle-wrapper.properties') }}
      - name: Build NeoForge and Forge bridges
        run: node scripts/build-bridge.mjs neoforge forge-1.20.1
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - name: Build Fabric bridge
        run: node scripts/build-bridge.mjs fabric
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: bridge
          path: resources/bridge/*.jar
          if-no-files-found: error

  build:
    name: build (${{ matrix.name }})
    needs: bridge
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: target/release/bundle/setup/*.exe
          - name: Linux
            os: ubuntu-22.04
            bundles: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: bridge
          path: resources/bridge
      - run: npm install --no-audit --no-fund
      - run: node scripts/build.mjs
      - run: node scripts/build-service.mjs
      - name: Generate Linux desktop and AppStream metadata
        if: runner.os == 'Linux'
        run: node scripts/linux-metadata.mjs
      - name: Build the app
        if: runner.os != 'Windows'
        run: npx tauri build
      - name: Build the app and Modsmith Setup
        if: runner.os == 'Windows'
        run: |
          npx tauri build --no-bundle
          node scripts/build-setup.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: modsmith-${{ runner.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  check-linux:
    name: check Linux package metadata
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modsmith-Linux
          path: out
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
      - name: Check the .deb
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find out -name '*.deb' | head -n 1)
          dpkg-deb --info "$deb"
          for field in Package Version Maintainer Homepage Section Description; do
            test -n "$(dpkg-deb --field "$deb" "$field")" || { echo "control field $field is empty"; exit 1; }
          done
          dpkg-deb --field "$deb" Maintainer | grep -qx 'Galaxy Development LLC <support@thegalaxy.dev>'
          root=$(mktemp -d)
          dpkg-deb -x "$deb" "$root"
          for f in usr/share/metainfo/dev.modsmith.workbench.metainfo.xml usr/share/applications/Modsmith.desktop usr/share/icons/hicolor/scalable/apps/modsmith.svg usr/share/icons/hicolor/32x32/apps/modsmith.png usr/share/icons/hicolor/48x48/apps/modsmith.png usr/share/icons/hicolor/64x64/apps/modsmith.png usr/share/icons/hicolor/128x128/apps/modsmith.png usr/share/icons/hicolor/256x256/apps/modsmith.png usr/share/icons/hicolor/512x512/apps/modsmith.png usr/share/doc/modsmith/copyright; do
            test -f "$root/$f" || { echo "missing $f"; exit 1; }
          done
          dpkg-deb --contents "$deb" | grep -E 'share/(metainfo|applications|icons|doc)/'
          desktop-file-validate "$root/usr/share/applications/Modsmith.desktop"
          appstreamcli validate --no-net --explain "$root/usr/share/metainfo/dev.modsmith.workbench.metainfo.xml"
          grep -q "<release version=\"$(dpkg-deb --field "$deb" Version)\"" "$root/usr/share/metainfo/dev.modsmith.workbench.metainfo.xml"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, check-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: modsmith-*
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          name: Modsmith ${{ github.ref_name }}
          generate_release_notes: true
          files: out/**/*
