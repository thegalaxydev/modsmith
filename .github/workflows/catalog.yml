name: Catalog builds

on:
  workflow_dispatch:
    inputs:
      entries:
        description: 'Catalog entries to check: all, untested, fabric, neoforge, forge, or ids separated by spaces'
        default: all
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-22.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: ids
        run: node scripts/catalog/ci.mjs list "${{ inputs.entries || 'all' }}" >> "$GITHUB_OUTPUT"

  service:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build -p modsmith-service --release
      - uses: actions/upload-artifact@v4
        with:
          name: modsmith-service
          path: target/release/modsmith-service
          if-no-files-found: error

  check:
    needs: [list, service]
    name: check (${{ matrix.id }})
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        id: ${{ fromJson(needs.list.outputs.ids) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libglu1-mesa
      - uses: actions/download-artifact@v4
        with:
          name: modsmith-service
          path: bin
      - name: Java runtimes Modsmith can choose from
        run: |
          chmod +x bin/modsmith-service
          mkdir -p ~/.jdks
          ln -s "$JAVA_HOME" ~/.jdks/temurin-25
          ls /usr/lib/jvm
      - name: Create, build and launch the project
        env:
          ALSOFT_DRIVERS: 'null'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x720x24" node scripts/catalog/launch-check.mjs bin/modsmith-service "${{ matrix.id }}" work "results/${{ matrix.id }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.id }}
          path: results/${{ matrix.id }}.json

  report:
    needs: check
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - run: node scripts/catalog/ci.mjs report results catalog-results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-results
          path: catalog-results.json
