name: Website

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'resources/brand/**'
      - 'registry/**'
      - 'packaging/apt/**'
      - 'scripts/apt-repo.mjs'
      - '.github/workflows/site.yml'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.mjs
      - name: Install APT repository tools
        if: hashFiles('packaging/apt/modsmith-archive-keyring.asc') != ''
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils appstream appstream-compose optipng librsvg2-common libgdk-pixbuf2.0-bin shared-mime-info
      - name: Build the signed APT repository
        if: hashFiles('packaging/apt/modsmith-archive-keyring.asc') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: node scripts/apt-repo.mjs --out site/dist/apt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
